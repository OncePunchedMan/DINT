name: Android APK

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v0.0.2"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore signing key
        run: |
          if [ -n "$DINT_KEYSTORE_BASE64" ]; then
            echo "$DINT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dint-upload.jks"
            echo "DINT_KEYSTORE_FILE=$RUNNER_TEMP/dint-upload.jks" >> "$GITHUB_ENV"
          fi
        env:
          DINT_KEYSTORE_BASE64: ${{ secrets.DINT_KEYSTORE_BASE64 }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: bash ./gradlew :app:assembleRelease
        env:
          DINT_VERSION_CODE: ${{ github.run_number }}
          DINT_VERSION_NAME: 0.9.${{ github.run_number }}
          DINT_KEYSTORE_PASSWORD: ${{ secrets.DINT_KEYSTORE_PASSWORD }}
          DINT_KEY_ALIAS: ${{ secrets.DINT_KEY_ALIAS }}
          DINT_KEY_PASSWORD: ${{ secrets.DINT_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          VERSION_NAME="0.9.${GITHUB_RUN_NUMBER}"
          mkdir -p release
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SOURCE_APK" ]; then
            SOURCE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          cp "$SOURCE_APK" "release/Dint_${VERSION_NAME}.apk"
          echo "APK_NAME=Dint_${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Upload branch APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_NAME }}
          path: release/${{ env.APK_NAME }}

      - name: Create GitHub release on master
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          VERSION_NAME="0.9.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION_NAME}"
          fi

          gh release create "$TAG" "release/Dint_${VERSION_NAME}.apk" \
            --title "Dint ${TAG}" \
            --notes "Automated APK from ${GITHUB_SHA}. Version ${VERSION_NAME} (${VERSION_CODE})."
        env:
          GH_TOKEN: ${{ github.token }}
